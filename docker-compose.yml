# ทางเลือกแทนคำสั่ง `docker run` ที่อยู่ใน scripts/setup-bwapp.ps1
#
#   docker compose up -d          # เริ่ม security lab
#   docker compose down           # ลบทิ้ง
#
# ทั้งสองวิธีให้ผลเหมือนกัน: คอนเทนเนอร์ชื่อ "bwapp" เปิดให้เข้าถึงได้ที่
# 127.0.0.1:8080 เท่านั้น ฐานข้อมูลยังไม่ถูก seed ที่นี่ - MySQL ภายใน
# image นี้เริ่มต้นแบบว่าง จึงต้องรัน scripts/setup-bwapp.ps1 ต่อท้าย เพื่อแปลง
# db/bwapp.sqlite เป็น schema ของ MySQL ที่แอปคาดหวัง และเพื่อทำให้
# ไดเรกทอรีอัปโหลดเป็นแบบเขียนได้
#
#   docker compose up -d
#   .\scripts\setup-bwapp.ps1     # seed ฐานข้อมูล, chmod โฟลเดอร์อัปโหลด, ล็อกอิน
#   .\scripts\Run-HttpFile.ps1 -File 'http\*.http' -SaveEvidence

services:
  bwapp:
    image: raesene/bwapp:latest
    container_name: bwapp
    # ผูกกับ loopback โดยตั้งใจ image นี้ถูกทำให้เต็มไปด้วย
    # RCE, SQLi และ LFI - อย่ามีทางเผยแพร่มันบนอินเทอร์เฟซที่ route ถึงได้
    ports:
      - "127.0.0.1:8080:80"
    # ไม่ mount volume: security lab นี้ตั้งใจให้ทิ้งได้เลย และการ mount
    # จาก host จะทำให้ข้อค้นพบช่องโหว่อัปโหลดเขียนไฟล์ลงใน repository ได้
    restart: "no"
